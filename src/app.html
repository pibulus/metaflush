<!doctype html>
<html lang="en" data-theme="clean">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Icons (icon-192/512 + og-image generated once the mascot art is final) -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%sveltekit.assets%/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

    <!-- Primary meta -->
    <title>metaflush — strip metadata, keep your privacy</title>
    <meta name="author" content="Pablo" />
    <meta name="application-name" content="metaflush" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f0fdf4" />
    <link rel="canonical" href="https://metaflush.app/" />
    <meta
      name="description"
      content="Strip EXIF, GPS, and tracking metadata from your photos and files — losslessly, 100% in your browser. Nothing is uploaded."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="metaflush" />
    <meta property="og:title" content="metaflush — strip metadata, keep your privacy" />
    <meta
      property="og:description"
      content="Wipe EXIF, GPS, and device metadata from your files. Lossless, 100% in your browser, nothing uploaded."
    />
    <meta property="og:url" content="https://metaflush.app/" />
    <meta property="og:image" content="https://metaflush.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="metaflush — strip metadata, keep your privacy" />
    <meta
      name="twitter:description"
      content="Wipe EXIF, GPS, and device metadata. Lossless, 100% in your browser."
    />
    <meta name="twitter:image" content="https://metaflush.app/og-image.png" />

    %sveltekit.head%
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/apple-splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/apple-splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/apple-splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="%sveltekit.assets%/splash/apple-splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
